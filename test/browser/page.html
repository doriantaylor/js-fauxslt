<!DOCTYPE html>
<!-- test page for fauxslt browser tests: a bare document with an
     item list, loaded by playwright, mutated by the library -->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>fauxslt test document</title>
    <!-- import map so the browser can resolve the bare 'markup-mixup'
         specifier used inside fauxslt.mjs -->
    <script type="importmap">
      { "imports": {
          "markup-mixup": "/node_modules/markup-mixup/markup-mixup.js"
      } }
    </script>
    <script type="module" src="/test/browser/init.js"></script>
  </head>
  <body>
    <main>
      <ul id="items">
        <li class="item">first</li>
        <li class="item">second</li>
        <li class="item hidden">third</li>
      </ul>
      <p id="para">some text</p>
    </main>
  </body>
</html>
